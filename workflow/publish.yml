name: Publish Water News to Royab

on:
  schedule:
    - cron: '0 */6 * * *' # هر ۶ ساعت یکبار
  workflow_dispatch: # امکان اجرای دستی برای تست

jobs:
  publish:
    runs-on: ubuntu-latest
    # این بخش اجازه می‌دهد ربات بتواند فایل‌های ارسالی را حذف و کامیت کند
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run publishing script
        run: python scripts/publish.py
        env:
          ROYAB_API_URL: ${{ secrets.ROYAB_API_URL }}
          ROYAB_API_KEY: ${{ secrets.ROYAB_API_KEY }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "Royab-News-Bot"
          git config --global user.email "bot@royab.co"
          git add news/*.json || true
          # چک می‌کنیم اگر فایلی حذف شده بود، کامیت انجام شود
          if ! git diff --cached --exit-code; then
            git commit -m "Auto-cleanup: Removed published news files"
            git push
          else
            echo "No changes to commit."
          fi
